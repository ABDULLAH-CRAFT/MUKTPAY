services:
  postgres:
    image: postgres:16-alpine
    container_name: muktpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: muktpay
      POSTGRES_PASSWORD: muktpay_dev_password
      POSTGRES_DB: muktpay
    ports:
      - '5432:5432'
    volumes:
      - muktpay_pgdata:/var/lib/postgresql/data

volumes:
  muktpay_pgdata:
